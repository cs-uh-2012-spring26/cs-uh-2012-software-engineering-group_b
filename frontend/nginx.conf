server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API routes to the Flask backend
    location /auth/ {
        proxy_pass http://api:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /classes/ {
        proxy_pass http://api:8000/classes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /bookings/ {
        proxy_pass http://api:8000/bookings/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
